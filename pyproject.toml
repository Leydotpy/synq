[project]
name = "v4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-clerk-sdk>=1.0.0",
    "django-cors-headers>=4.9.0",
    "django-guardian>=3.3.3",
    "django-redis>=7.0.0",
    "djangorestframework>=3.17.1",
    "fastapi>=0.140.0",
    "gunicorn>=26.0.0",
    "aio-pika>=10.0.1,<11",
    "jrtc[kafka]>=3.1,<4",
    "jrtc-video>=3,<4",
    "python-decouple>=3.8",
    "python-socketio>=5.16.3",
    "redis>=8.0.1",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[tool.uv]
# Broka 0.0.2's wheel accidentally declares Django >=6.1 as a mandatory
# dependency even though its Django integration advertises Django >=5.0 and
# Synq's django-celery-beat release currently supports Django <6.1.  Keep the
# application on its supported Django line until Broka corrects that metadata.
override-dependencies = ["django>=6.0.7,<6.1"]
