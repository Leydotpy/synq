name: Gateway control plane
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: synq_gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      UV_PYTHON: "3.14"
      GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      GATEWAY_TEST_DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run --frozen python src/manage.py makemigrations --check --dry-run --settings=conf.test_settings
      - run: >-
          uv run --frozen python src/manage.py test
          apps.meetings.tests.test_gateway_tickets
          apps.meetings.tests.test_gateway_ticket_races
          apps.meetings.tests.test_gateway_admission
          apps.meetings.tests.test_gateway_commands
          apps.meetings.tests.test_gateway_command_streams
          apps.meetings.tests.test_admission_and_invites
          apps.meetings.tests.test_lifecycle_hardening
          apps.meetings.tests.test_jrtc_signaling_contracts
          apps.meetings.tests.test_jrtc_contracts
          apps.meetings.tests.test_jrtc_persistence_contracts
          apps.meetings.tests.test_runtime_lifecycle_contracts
          apps.meetings.tests.test_jrtc_event_plane
          apps.meetings.tests.test_realtime_namespace
          --settings=conf.gateway_postgres_test_settings
